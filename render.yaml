# Render Blueprint: one always-on Docker web service running n8n with the Omulimu workflows.
# n8n's own data (workflows, credentials, owner account, executions) lives in Supabase (schema "n8n"),
# so restarts and redeploys lose nothing and no paid disk is needed. Bot tables live in schema "omulimu".
# Secrets are `sync: false`: Render asks for them when the Blueprint is created.
services:
  - type: web
    name: omulimu-n8n-fra
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: standard           # 1 CPU / 2 GB: n8n + its task runner; free sleeps and starves the runner
    region: frankfurt        # same city as the Supabase project (eu-central-1); closest well-connected hub to Kampala
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_REGION
        value: eu-central-1
      - key: DB_PASSWORD          # password of the omulimu_app role
        sync: false
      - key: N8N_ENCRYPTION_KEY   # keep it stable: n8n encrypts stored credentials with it
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: LLM_API_KEY          # OpenRouter key (sk-or-...)
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-4o-mini
      - key: OPENAI_API_KEY       # optional: when set, the classifier uses OpenAI's Decisions API (gpt-6-luna)
        sync: false
      - key: CLASSIFIER_MODE      # optional override: decisions | chat
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: SUPPORT_LINE
        sync: false
      - key: FORCE_LLM_FAIL
        value: "false"
